info:
  name: Update My Profile
  type: http
  seq: 1

http:
  method: PATCH
  url: "{{BASE_URL}}/api/users/me"
  headers:
    - name: Authorization
      value: Bearer {{accessToken}}
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "firstName": "Bruno",
        "lastName": "Mars"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
