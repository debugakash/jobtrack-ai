info:
  name: Update My Profile
  type: http
  seq: 1

http:
  method: PATCH
  url: "{{BASE_URL}}/api/users/me"
  headers:
    - name: Authorization
      value: Bearer {{accessToken}}
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "firstName": "Bruno",
        "lastName": "Mars",
        "phone": "9876543210",
        "location": "Indore, India",
        "headline": "Full Stack Developer",
        "bio": "Full Stack Developer building scalable web applications with React, TypeScript, Node.js and PostgreSQL.",
        "linkedinUrl": "https://www.linkedin.com/in/bruno-mars",
        "githubUrl": "https://github.com/bruno-mars",
        "portfolioUrl": "https://bruno-mars.com",
        "skills": "React.js, TypeScript, JavaScript, Node.js, Express.js, PostgreSQL, Prisma"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
