info:
  name: Change Password
  type: http
  seq: 6

http:
  method: PATCH
  url: "{{BASE_URL}}/api/auth/me/password"
  headers:
    - name: Authorization
      value: Bearer {{accessToken}}
  body:
    type: json
    data: |-
      {
        "currentPassword": "PasswordBruno123",
        "newPassword": "BrunoPass123"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
